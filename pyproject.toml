[tool.poetry]
name = "hwave"
version = "2.0.0"
description = "UHF"
authors = ["H-Wave developers <hwave-dev@issp.u-tokyo.ac.jp>"]
license = "GPL-3.0-or-later"

readme = "README.md"
repository = "https://github.com/issp-center-dev/H-Wave"

packages = [
  { include = "hwave", from = "src" }
  ]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.14"
scipy = "^1.7"
requests = "^2.28.1"
tomli = "^2.0.1"

# Optional: the IR (intermediate representation) Matsubara basis used by
# matsubara_basis = "ir". sparse-ir 2.x requires Python >= 3.10, which the
# floor above now guarantees; pinning >= 2.0 keeps a single supported major
# so the IR axis conditioning guard (#153) has one well-defined regime
# boundary. Install with: pip install "hwave[ir]"
sparse-ir = {version = ">=2.0", optional = true}

[tool.poetry.extras]
ir = ["sparse-ir"]

[tool.poetry.group.dev.dependencies]
flake8 = "^6.0.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
coverage = "^7.0.0"

[tool.poetry.scripts]
hwave = "hwave.qlms:main"
hwave_dos = "hwave.dos:main"
hwave_sc = "hwave.sc:main"
hwave_tsweep = "hwave.tsweep:main"

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "assignment"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
