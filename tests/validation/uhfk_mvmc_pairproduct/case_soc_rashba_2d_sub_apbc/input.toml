[log]
  print_level = 1
  print_step  = 50

[mode]
  mode = "UHFk"
  # flag_fock must live in [mode], NOT [mode.param]: uhfk.py:82 reads
  # info_mode directly. Fock is ON so this fixture minimises the same
  # mean-field functional as the validation ComplexUHF binary, which
  # hard-codes the on-site exchange term at compile time
  # (ComplexUHF/include/Def.h:31 "#define Fock 1") with no runtime
  # switch.
  flag_fock = true
  # v3.1 SOC dispatch: orbital index in Transfer.dat carries spin as
  # 2 * orb + spin (Wannier90 SOI packing). Geometry.dat's norb is 2
  # (one physical orbital times two spin-orbital labels).
  enable_spin_orbital = true

[mode.param]
  # v3.6 case_soc_rashba_2d_sub_apbc: same geometry / SOC parameters as
  # v3.5 case_soc_rashba_2d_sub (CellShape=[6,4,1], SubShape=[2,2,1],
  # folded BZ [3,2,1], Rashba t=1, alpha=0.5, U=2) but with APBC in x.
  # The APBC twist shifts the folded k-mesh by (pi, 0, 0) / L, which
  # changes the HOMO-LUMO gap structure vs PBC. Phase 2 step 2b runs
  # scripts/soc_pilot_gap.py under theta=(pi, 0, 0) to pin the closed-
  # shell Ncond; the value below is a placeholder that Phase 2 updates.
  Ncond        = 8
  IterationMax = 2000
  EPS          = 14
  Mix          = 0.5
  RndSeed      = 12345
  T            = 0.0
  CellShape    = [6, 4, 1]
  SubShape     = [2, 2, 1]
  BoundaryCondition = ["antiperiodic", "periodic", "periodic"]

[file]
[file.input]
  path_to_input = ""
  geometry_uhf = "geometry_uhf.dat"
  onebodyg_uhf = "OneBodyG.dat"
[file.input.interaction]
  path_to_input = "./"
  Geometry     = "Geometry.dat"
  Transfer     = "Transfer.dat"
  CoulombIntra = "CoulombIntra.dat"

[file.output]
  path_to_output = "output"
  energy   = "energy.dat"
  eigen    = "eigen.npz"
  green    = "green.npz"
  onebodyg = "greenone.dat"
  occupation = "occupation.npz"
