# The RPA/FLEX equivalence-table calibration workflow. It produces the
# measurement artifacts tests/equivalence_freeze_check.py aggregates.
#
# Runs tests/equivalence_measure.py THREE times per gating runner (the
# "3 runs" of the calibration protocol) plus ONE dedicated timed
# `python -m unittest tests.test_rpa_flex_equivalence_table` invocation
# (the quantity the 120s freeze-time budget gates), uploading every
# output as a separate artifact even when a step fails. Whoever runs
# the calibration downloads all 16 artifacts (4 gating runners x (3
# measurement + 1 unittest-timing)) with `gh run download` and feeds
# them to `tests/equivalence_freeze_check.py` to decide whether an
# iteration of the calibration loop is measurement-affecting or ready
# to freeze. This workflow itself asserts nothing -- every step's
# job-level pass/fail signal is preserved (a solver rejecting/erroring
# on a cell it should not is still a real CI failure), but each step's
# own housekeeping (timing capture, JSON emission, artifact upload)
# runs regardless via `if: always()`.
#
# TRIGGERS. `workflow_dispatch` alone is not enough: GitHub only offers
# the Run-workflow button for workflows present on the repository's
# DEFAULT branch, which is `main`, while this work targets `develop`.
# Until the file reaches `main` the workflow is reachable only by push,
# so the push list must name every branch a calibration can be needed
# on:
#   * feature/equivalence-table -- produces the FIRST calibration, before
#     anything is merged. Harmless once the branch is deleted.
#   * develop -- the integration target. Without it the calibration this
#     whole change is built around becomes untriggerable the moment the
#     feature branch goes away.
# No `pull_request` trigger. A calibration is a MEASUREMENT of a
# specific commit, taken deliberately and then recorded by hand in
# tests/equivalence_calibration_log.md and tests/equivalence_benchmark.md
# -- not a gate on a proposed change. Running it on every push to every
# open pull request would spend 16 jobs per push producing artifacts
# nobody reads, and would not add a signal: the equivalence tests
# themselves already run in the ordinary test workflow on pull requests.
# Once this file is on `main`, the Run-workflow button covers the
# occasional one-off (e.g. calibrating a pull-request head) directly.

name: Equivalence table calibration

on:
  push:
    branches: ["feature/equivalence-table", "develop"]
  workflow_dispatch: {}

jobs:
  calibrate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    # Pinned to 1: the Linux x86_64 development machine used for the
    # pre-merge candidate calibration pass SEGFAULTS partway through a
    # single `equivalence_measure` process under its BLAS backend's
    # default thread pool -- repeated small-matrix solver constructions
    # across ~27 cells accumulate OpenBLAS/OMP worker threads until
    # pthread_create fails. ubuntu-latest's
    # numpy/scipy wheels are also OpenBLAS-backed, so the same failure
    # mode is plausible here at the full 37-cell registry size; pinning
    # every BLAS/OMP thread-count env var to 1 eliminates it (verified
    # on that machine: 3/3 clean runs afterward, 0/3 before -- see
    # tests/equivalence_calibration_log.md, Event 2).
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install h-wave
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Calibration measurement 1/3
        if: always()
        run: |
          set +e
          start=$(date +%s.%N)
          python -m tests.equivalence_measure > calib-${{ matrix.python-version }}-1.json
          status=$?
          end=$(date +%s.%N)
          proc=$(python3 -c "print($end - $start)")
          echo "{\"process_seconds\": $proc}" >> calib-${{ matrix.python-version }}-1.json
          exit $status

      - name: Calibration measurement 2/3
        if: always()
        run: |
          set +e
          start=$(date +%s.%N)
          python -m tests.equivalence_measure > calib-${{ matrix.python-version }}-2.json
          status=$?
          end=$(date +%s.%N)
          proc=$(python3 -c "print($end - $start)")
          echo "{\"process_seconds\": $proc}" >> calib-${{ matrix.python-version }}-2.json
          exit $status

      - name: Calibration measurement 3/3
        if: always()
        run: |
          set +e
          start=$(date +%s.%N)
          python -m tests.equivalence_measure > calib-${{ matrix.python-version }}-3.json
          status=$?
          end=$(date +%s.%N)
          proc=$(python3 -c "print($end - $start)")
          echo "{\"process_seconds\": $proc}" >> calib-${{ matrix.python-version }}-3.json
          exit $status

      # The 120s freeze-time budget's own sample: the unittest MODULE
      # process (interpreter startup/import included), timed once per
      # gating runner -- a SEPARATE quantity from the three
      # `equivalence_measure` process_seconds above (those are
      # diagnostics only; this is what actually gates).
      - name: Equivalence table unittest timing
        if: always()
        run: |
          set +e
          start=$(date +%s.%N)
          python -m unittest tests.test_rpa_flex_equivalence_table
          status=$?
          end=$(date +%s.%N)
          proc=$(python3 -c "print($end - $start)")
          echo "{\"unittest_module_process_seconds\": $proc}" > unittest-${{ matrix.python-version }}.json
          exit $status

      - name: Upload calibration artifact 1/3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calib-${{ matrix.python-version }}-1
          path: calib-${{ matrix.python-version }}-1.json
          if-no-files-found: warn

      - name: Upload calibration artifact 2/3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calib-${{ matrix.python-version }}-2
          path: calib-${{ matrix.python-version }}-2.json
          if-no-files-found: warn

      - name: Upload calibration artifact 3/3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calib-${{ matrix.python-version }}-3
          path: calib-${{ matrix.python-version }}-3.json
          if-no-files-found: warn

      - name: Upload unittest-timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.python-version }}
          path: unittest-${{ matrix.python-version }}.json
          if-no-files-found: warn
