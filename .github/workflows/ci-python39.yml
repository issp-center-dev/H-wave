name: CI Python 3.10+

# The suite runs in two shapes (see tests/heavy_tests.py for the registry
# and the selection rule):
#
#   test       -- the FAST gate. HWAVE_FULL_TESTS is NOT set, so the
#                 opt-in exact-diagonalization tests are skipped. Runs
#                 the whole suite once, with pytest and the coverage
#                 floor.
#   test-full  -- the FULL-ONLY tests, HWAVE_FULL_TESTS=1: only the test
#                 files that contain a test gated on that switch, run
#                 once with pytest and without coverage, on Python 3.12
#                 only (`test` keeps all three versions). Everything else
#                 is the fast gate's job and is not repeated here.
#
# Both jobs carry a numpy axis: the default leg resolves the newest numpy
# 2.x that pyproject allows, and one leg per job pins numpy < 2 (see the
# matrix comments). pyproject's old "^1.14" constraint had kept every CI
# run on numpy 1.26 without anyone choosing that.
#
# Both jobs are driven by the single `on:` block below, so BOTH run on
# push AND on pull_request. That is deliberate and is the decision on
# record: the ED assets must run BEFORE a merge, not after it. test-full
# is not a nightly and is not `if:`-gated to pushes.
#
# MEASURED on GitHub's ubuntu runner (PR #327, Python 3.12, 2026-11-04),
# when test-full still repeated the whole suite twice -- wall clock:
#
#            unittest discover   pytest -v --cov
#   fast         1116 s            (~40 min)      (3938 tests)
#   full         4842 s             5947 s        (same, opt-in on)
#
# of which the 28 files holding a HWAVE_FULL_TESTS-gated test took
# 4086 s / 4698 s and the other 177 files 756 s / 1248 s; coverage added
# 23%. So the full job's unique work -- the gated files, once, without
# coverage -- is about an hour, against three hours for the old shape.
# Coverage is NOT lost: the full suite's coverage.xml was byte-identical
# to the fast gate's (see the coverage step of `test`).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# One run per pull request (or per branch for a push): a new push to the
# same PR cancels the run still going for its previous head. Pushes to
# develop / main are never cancelled -- each of those runs is a record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------
  # FAST gate: every push and every PR. HWAVE_FULL_TESTS deliberately
  # unset -- do not add it here.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # numpy major. "" lets Poetry resolve the newest release that
        # pyproject allows (numpy 2.x since the constraint became
        # ">=1.26,<3"); "<2" pins the leg to the last 1.x line. The tests
        # branch on the major in a few places (NUMPY_BELOW_2 in
        # tests/test_flex_second_order_compat.py and test_flex_hf_scf.py:
        # bit-identical comparisons on numpy 2, a last-bit allowance on
        # numpy < 2 because the FFT/BLAS memory paths differ there), so
        # both majors must run. One numpy < 2 leg is enough for that; it
        # rides on the newest interpreter.
        numpy: [""]
        include:
          - python-version: "3.12"
            numpy: "<2"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify Python version
      run: |
        python --version
        python -c "import sys; assert sys.version_info >= (3, 10), f'Python 3.10+ required, got {sys.version}'"

    - name: Install Poetry
      run: |
        pipx install poetry
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        # The numpy pin is part of the key: a venv cached for the numpy 2
        # leg must not be handed to the numpy < 2 leg (or vice versa).
        key: venv-v5-${{ runner.os }}-${{ matrix.python-version }}-numpy${{ matrix.numpy }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project and dependencies
      run: poetry install --no-interaction --with dev

    - name: Pin numpy for this leg
      # Only the numpy < 2 leg. pip, not Poetry, so the pin does not touch
      # pyproject.toml; the "Verify installation" step prints what was
      # actually installed and the assertion below fails the leg if the
      # pin did not take (a cached venv with the wrong major, say).
      if: matrix.numpy != ''
      run: |
        poetry run pip install "numpy${{ matrix.numpy }}"
        poetry run python -c "import numpy; v = numpy.__version__; assert int(v.split('.')[0]) < 2, f'expected numpy < 2 on this leg, got {v}'"

    - name: Provision the reference revision for the compatibility comparisons
      # tests/test_flex_second_order_compat.py and the three harnesses that
      # share its develop_checkout() compare this tree against a SECOND
      # source tree at DEVELOP_COMMIT. Without one they skip; once this step
      # has provisioned one it also sets HWAVE_REQUIRE_DEVELOP_COMPARISON, so
      # a reference that is present but unusable (wrong revision, dirty) is a
      # failure rather than a silent skip.
      #
      # actions/checkout@v4 fetches depth 1, hence the explicit fetch of the
      # named revision. The added worktree shares this checkout's object
      # store, and it lives under RUNNER_TEMP -- outside the checkout -- so
      # the "tracked tree clean" step below is unaffected (the command writes
      # only under .git/worktrees). The tests run the reference tree in a
      # subprocess with sys.executable and PYTHONPATH=<ref>/src:<ref>, so the
      # venv installed above serves both trees and the reference tree needs
      # none of its own.
      #
      # TOLERANT, deliberately: a pull request from a fork whose origin does
      # not carry the revision -- or a transient network failure -- must not
      # fail the whole job. Each failure warns and leaves the two variables
      # UNSET, so the comparisons go back to skipping with their own reason.
      # The require flag is only ever exported once a reference really is
      # there, which is what keeps it meaningful: an exported flag with no
      # reference behind it would turn every comparison into a failure.
      run: |
        ref="$(poetry run python -c 'from tests.test_flex_second_order_compat import DEVELOP_COMMIT; print(DEVELOP_COMMIT)')"
        if ! git fetch --depth=1 origin "$ref"; then
          echo "::warning::could not fetch the reference revision $ref from origin (a fork may not carry it); the develop comparisons will skip"
          exit 0
        fi
        if ! git worktree add --detach "${RUNNER_TEMP}/hwave-reference" "$ref"; then
          echo "::warning::could not add a worktree at the reference revision $ref; the develop comparisons will skip"
          exit 0
        fi
        echo "HWAVE_DEVELOP_CHECKOUT=${RUNNER_TEMP}/hwave-reference" >> "$GITHUB_ENV"
        echo "HWAVE_REQUIRE_DEVELOP_COMPARISON=1" >> "$GITHUB_ENV"

    - name: Provision the reference revision for the bond archive comparison
      # tests/test_eliashberg_bond_entry.py's flag-off comparison is against
      # a DIFFERENT revision than the step above: the merge the pairing
      # branch was cut from (BOND_REFERENCE_COMMIT), which is later than
      # DEVELOP_COMMIT. One checkout cannot be at two revisions, so this
      # comparison gets a second worktree and its OWN pair of variables --
      # sharing the pair above would declare a comparison mandatory whose
      # reference is not there.
      #
      # Same mechanics and the same tolerance as the step above: a fetch or
      # worktree failure warns and leaves both variables unset, and the
      # comparison goes back to skipping with its own reason.
      run: |
        ref="$(poetry run python -c 'from tests.test_eliashberg_bond_entry import BOND_REFERENCE_COMMIT; print(BOND_REFERENCE_COMMIT)')"
        if ! git fetch --depth=1 origin "$ref"; then
          echo "::warning::could not fetch the bond reference revision $ref from origin (a fork may not carry it); the bond archive comparison will skip"
          exit 0
        fi
        if ! git worktree add --detach "${RUNNER_TEMP}/hwave-reference-bond" "$ref"; then
          echo "::warning::could not add a worktree at the bond reference revision $ref; the bond archive comparison will skip"
          exit 0
        fi
        echo "HWAVE_DEVELOP_CHECKOUT_BOND=${RUNNER_TEMP}/hwave-reference-bond" >> "$GITHUB_ENV"
        echo "HWAVE_REQUIRE_DEVELOP_COMPARISON_BOND=1" >> "$GITHUB_ENV"

    - name: Install optional dependencies (IR basis)
      run: poetry run pip install sparse-ir

    - name: Verify installation
      run: |
        poetry run python -c "import numpy; print('numpy version:', numpy.__version__)"
        poetry run python -c "import scipy; print('scipy version:', scipy.__version__)"
        poetry run python -c "import hwave; print('hwave imported successfully')"

    - name: Run tests with pytest and coverage
      # The one test pass of this job (the former `unittest discover`
      # pass ran the same suite a second time -- 23-33 min on the CI
      # runners -- and found nothing pytest does not: pytest runs every
      # unittest-style test, and the pytest-only tests besides). This
      # step GATES: it enforces the coverage floor (issue #84 -- the
      # floor configured in pytest.ini was silently ignored for a long
      # time, and this step used to be continue-on-error, so neither the
      # tests nor the gate could actually fail CI).
      #
      # The 80% floor stays HERE, on the fast gate, and was NOT moved to
      # test-full and NOT lowered. MEASURED: the fast gate and the full
      # suite report the IDENTICAL coverage, 9039/10355 lines = 87.2912%
      # -- byte-for-byte the same covered/valid pair in both coverage.xml
      # reports. The 18 opt-in tests contribute zero unique lines: they
      # re-derive numerical values through solver paths the rest of the
      # suite already walks. Both --cov-fail-under=80 and
      # tests/_coverage_floor.py pass on the fast gate with ~7 points of
      # headroom, so the split costs the coverage gate nothing.
      #
      # --durations=30: the 30 slowest tests of the run, printed at the
      # end, so a run's wall clock can be attributed without reading the
      # verbose log's timestamps.
      run: |
        poetry run pytest tests/ -v --durations=30 --cov=src/hwave --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        poetry run python tests/_coverage_floor.py coverage.xml 80

    - name: Verify the test suite left the tracked tree clean
      # !cancelled(): report isolation defects even when the gating test
      # step failed -- the diagnostic is most useful exactly then
      if: ${{ !cancelled() }}
      run: |
        # A test that modifies/deletes a TRACKED file -- or leaves a NEW stray
        # generated file in a committed input/output dir -- is a test-isolation
        # bug (this is how a generated *_fixture.npz once got committed and then
        # deleted on every run). `git diff --exit-code` catches tracked
        # modifications/deletions; the scoped `git status` catches a new stray
        # file in the committed RPA fixture/output dirs. Untracked artifacts
        # elsewhere (coverage.xml, __pycache__, gitignored outputs) are ignored.
        git diff --exit-code || {
          echo "::error::the test suite modified or deleted tracked file(s) -- see the diff above; tests must write generated files to a temp dir, not into the committed tree";
          exit 1;
        }
        stray="$(git status --porcelain -- tests/rpa/input tests/rpa/output)"
        if [ -n "$stray" ]; then
          echo "::error::the test suite left stray files in a committed test dir:";
          echo "$stray";
          exit 1;
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false


  # ---------------------------------------------------------------------
  # FULL-ONLY tests: the same provisioning as `test`, on Python 3.12 only,
  # with HWAVE_FULL_TESTS=1 so the opt-in exact-diagonalization tests run,
  # restricted to the test files that contain such a test and run once,
  # with pytest, without coverage (see the note at the top for the
  # measurements behind this shape). Triggered on pull_request as well as
  # push.
  # ---------------------------------------------------------------------
  test-full:
    runs-on: ubuntu-latest
    # This switches the opt-in exact-diagonalization tests ON for every
    # step below.
    env:
      HWAVE_FULL_TESTS: "1"
    # ONE Python version, unlike `test`: the full-only tests are numerical
    # content (exact-diagonalization and dense-sum oracles), which depends
    # on the numpy / scipy stack, not on the interpreter version. Three
    # interpreter legs ran the same ~hour of arithmetic three times;
    # interpreter-version breakage is the fast gate's job, which keeps all
    # three versions.
    #
    # TWO numpy majors, though: that IS the stack the oracles depend on.
    # The diagnostic ceilings and the equivalence table were frozen on
    # numpy 1.26 (every CI leg ran 1.26.4 while pyproject still said
    # "^1.14"), and the compatibility tests take a different branch per
    # major (NUMPY_BELOW_2). The "" leg resolves the newest numpy 2.x;
    # the "<2" leg keeps the historical stack. Both must stay green.
    strategy:
      matrix:
        python-version: ["3.12"]
        numpy: ["", "<2"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify Python version
      run: |
        python --version
        python -c "import sys; assert sys.version_info >= (3, 10), f'Python 3.10+ required, got {sys.version}'"

    - name: Install Poetry
      run: |
        pipx install poetry
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        # The numpy pin is part of the key (see the `test` job).
        key: venv-v5-${{ runner.os }}-${{ matrix.python-version }}-numpy${{ matrix.numpy }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project and dependencies
      run: poetry install --no-interaction --with dev

    - name: Pin numpy for this leg
      # Only the numpy < 2 leg; see the same step of the `test` job.
      if: matrix.numpy != ''
      run: |
        poetry run pip install "numpy${{ matrix.numpy }}"
        poetry run python -c "import numpy; v = numpy.__version__; assert int(v.split('.')[0]) < 2, f'expected numpy < 2 on this leg, got {v}'"

    - name: Provision the reference revision for the compatibility comparisons
      # tests/test_flex_second_order_compat.py and the three harnesses that
      # share its develop_checkout() compare this tree against a SECOND
      # source tree at DEVELOP_COMMIT. Without one they skip; once this step
      # has provisioned one it also sets HWAVE_REQUIRE_DEVELOP_COMPARISON, so
      # a reference that is present but unusable (wrong revision, dirty) is a
      # failure rather than a silent skip.
      #
      # actions/checkout@v4 fetches depth 1, hence the explicit fetch of the
      # named revision. The added worktree shares this checkout's object
      # store, and it lives under RUNNER_TEMP -- outside the checkout -- so
      # the "tracked tree clean" step below is unaffected (the command writes
      # only under .git/worktrees). The tests run the reference tree in a
      # subprocess with sys.executable and PYTHONPATH=<ref>/src:<ref>, so the
      # venv installed above serves both trees and the reference tree needs
      # none of its own.
      #
      # TOLERANT, deliberately: a pull request from a fork whose origin does
      # not carry the revision -- or a transient network failure -- must not
      # fail the whole job. Each failure warns and leaves the two variables
      # UNSET, so the comparisons go back to skipping with their own reason.
      # The require flag is only ever exported once a reference really is
      # there, which is what keeps it meaningful: an exported flag with no
      # reference behind it would turn every comparison into a failure.
      run: |
        ref="$(poetry run python -c 'from tests.test_flex_second_order_compat import DEVELOP_COMMIT; print(DEVELOP_COMMIT)')"
        if ! git fetch --depth=1 origin "$ref"; then
          echo "::warning::could not fetch the reference revision $ref from origin (a fork may not carry it); the develop comparisons will skip"
          exit 0
        fi
        if ! git worktree add --detach "${RUNNER_TEMP}/hwave-reference" "$ref"; then
          echo "::warning::could not add a worktree at the reference revision $ref; the develop comparisons will skip"
          exit 0
        fi
        echo "HWAVE_DEVELOP_CHECKOUT=${RUNNER_TEMP}/hwave-reference" >> "$GITHUB_ENV"
        echo "HWAVE_REQUIRE_DEVELOP_COMPARISON=1" >> "$GITHUB_ENV"

    - name: Provision the reference revision for the bond archive comparison
      # tests/test_eliashberg_bond_entry.py's flag-off comparison is against
      # a DIFFERENT revision than the step above: the merge the pairing
      # branch was cut from (BOND_REFERENCE_COMMIT), which is later than
      # DEVELOP_COMMIT. One checkout cannot be at two revisions, so this
      # comparison gets a second worktree and its OWN pair of variables --
      # sharing the pair above would declare a comparison mandatory whose
      # reference is not there.
      #
      # Same mechanics and the same tolerance as the step above: a fetch or
      # worktree failure warns and leaves both variables unset, and the
      # comparison goes back to skipping with its own reason.
      run: |
        ref="$(poetry run python -c 'from tests.test_eliashberg_bond_entry import BOND_REFERENCE_COMMIT; print(BOND_REFERENCE_COMMIT)')"
        if ! git fetch --depth=1 origin "$ref"; then
          echo "::warning::could not fetch the bond reference revision $ref from origin (a fork may not carry it); the bond archive comparison will skip"
          exit 0
        fi
        if ! git worktree add --detach "${RUNNER_TEMP}/hwave-reference-bond" "$ref"; then
          echo "::warning::could not add a worktree at the bond reference revision $ref; the bond archive comparison will skip"
          exit 0
        fi
        echo "HWAVE_DEVELOP_CHECKOUT_BOND=${RUNNER_TEMP}/hwave-reference-bond" >> "$GITHUB_ENV"
        echo "HWAVE_REQUIRE_DEVELOP_COMPARISON_BOND=1" >> "$GITHUB_ENV"

    - name: Install optional dependencies (IR basis)
      run: poetry run pip install sparse-ir

    - name: Verify installation
      run: |
        poetry run python -c "import numpy; print('numpy version:', numpy.__version__)"
        poetry run python -c "import scipy; print('scipy version:', scipy.__version__)"
        poetry run python -c "import hwave; print('hwave imported successfully')"

    - name: Run the full-only tests with pytest
      # Only the test files that contain a test gated on HWAVE_FULL_TESTS
      # -- through the opt-in registry of tests/heavy_tests.py (`from
      # tests.heavy_tests import heavy`) or a class-level
      # full_suite_enabled() check. The files are selected at run time so
      # the list cannot go stale; their fast tests ride along (a few
      # minutes). Everything else is the fast gate's job (`test` above)
      # and is not repeated here, and neither is the unittest pass: pytest
      # runs every unittest-style test. No coverage either -- the full
      # suite's coverage was byte-identical to the fast gate's, and the
      # fast gate keeps the floor. --durations=30: the 30 slowest tests of
      # the run, printed at the end.
      run: |
        gated="$(grep -l -E 'full_suite_enabled|heavy_tests import|HWAVE_FULL_TESTS' tests/test_*.py | sort)"
        if [ -z "$gated" ]; then
          echo "::error::no test file is gated on HWAVE_FULL_TESTS; the selection rule above no longer matches the suite";
          exit 1;
        fi
        echo "full-only test files ($(echo "$gated" | wc -l | tr -d ' ')):"
        echo "$gated"
        poetry run pytest $gated -v --durations=30

    - name: Verify the test suite left the tracked tree clean
      # !cancelled(): report isolation defects even when the gating test
      # step failed -- the diagnostic is most useful exactly then
      if: ${{ !cancelled() }}
      run: |
        # A test that modifies/deletes a TRACKED file -- or leaves a NEW stray
        # generated file in a committed input/output dir -- is a test-isolation
        # bug (this is how a generated *_fixture.npz once got committed and then
        # deleted on every run). `git diff --exit-code` catches tracked
        # modifications/deletions; the scoped `git status` catches a new stray
        # file in the committed RPA fixture/output dirs. Untracked artifacts
        # elsewhere (coverage.xml, __pycache__, gitignored outputs) are ignored.
        git diff --exit-code || {
          echo "::error::the test suite modified or deleted tracked file(s) -- see the diff above; tests must write generated files to a temp dir, not into the committed tree";
          exit 1;
        }
        stray="$(git status --porcelain -- tests/rpa/input tests/rpa/output)"
        if [ -n "$stray" ]; then
          echo "::error::the test suite left stray files in a committed test dir:";
          echo "$stray";
          exit 1;
        fi

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
        pipx install poetry
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --no-interaction --with dev

    - name: Run flake8
      run: poetry run flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run black format
      run: poetry run black src/ tests/

    - name: Run isort format
      run: poetry run isort src/ tests/

    - name: Run mypy
      run: poetry run mypy src/
      continue-on-error: true
